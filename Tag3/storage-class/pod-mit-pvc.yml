apiVersion: v1
kind: Pod
metadata:
  name: pod-pvc
spec:
  containers:
  - name: busybox
    image: busybox
    command: [ "sh", "-c", "echo test pvc >> /output/test.txt; sleep 1h" ]
    volumeMounts:
    - name: pod-volume
      mountPath: /output
  volumes:
  - name: pod-volume
    persistentVolumeClaim:
      claimName: pv-claim
  restartPolicy: Never
