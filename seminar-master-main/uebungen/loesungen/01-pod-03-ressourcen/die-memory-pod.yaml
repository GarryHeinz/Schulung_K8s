apiVersion: v1
kind: Pod
metadata:
  name: memory-limit-test
spec:
  containers:
  - name: memory-hog
    image: python:3.9
    command:
    - python3
    - -c
    - |
      a = []
      while True:
          a.append(a * 10**6)  # Allocate 1 MB repeatedly
    resources:
      limits:
        memory: "500Mi"
      requests:
        memory: "500Mi"
  restartPolicy: Never

