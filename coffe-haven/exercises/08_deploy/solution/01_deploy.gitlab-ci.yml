stages:
  - test
  - build
  - deploy

variables:
  LOG_LEVEL: "DEBUG"

lint-test-job:
  image: ghcr.io/astral-sh/uv:0.9.24-python3.10-alpine
  stage: test
  script:
    - uv run ruff check

unit-test-job:
  image: ghcr.io/astral-sh/uv:0.9.24-python3.10-alpine
  stage: test
  before_script:
    - cd $CI_PROJECT_DIR
  script:
    - uv run pytest

build-job:
  stage: build
  image: quay.io/buildah/stable:latest
  variables:
    REGISTRY_HOST: "gitlab-schulung.oci.ordix.de"
    REGISTRY_PORT: "5050"
    REGISTRY_IMAGE_PATH: "user1/coffee-haven"
  before_script:
    - echo "$CI_REGISTRY_PASSWORD" | buildah login --username "$CI_REGISTRY_USER" --password-stdin "$REGISTRY_HOST:$REGISTRY_PORT"
    - export APP_IMAGE="$REGISTRY_HOST:$REGISTRY_PORT/$REGISTRY_IMAGE_PATH:$CI_COMMIT_SHORT_SHA"
    - export APP_IMAGE_LATEST="$REGISTRY_HOST:$REGISTRY_PORT/$REGISTRY_IMAGE_PATH:latest"
  script:
    - buildah bud --isolation=chroot -t "$APP_IMAGE" -t "$APP_IMAGE_LATEST" .
    - buildah push "$APP_IMAGE"
    - buildah push "$APP_IMAGE_LATEST"

deploy:
  stage: deploy
  variables:
    DEPLOY_USER: "opc"
    DEPLOY_HOST: "127.0.0.1"
    REGISTRY_HOST: "gitlab-schulung.oci.ordix.de"
    REGISTRY_PORT: "5050"
    REGISTRY_IMAGE_PATH: "user1/coffee-haven"
    APP_IMAGE: "$REGISTRY_HOST:$REGISTRY_PORT/$REGISTRY_IMAGE_PATH:latest"
    SSH_KEY_NAME: "CI-WorkShop-01.pem"
  before_script:
    - apk add --no-cache openssh-client glab
    - glab auth login --job-token $CI_JOB_TOKEN --hostname $CI_SERVER_FQDN --api-protocol $CI_SERVER_PROTOCOL
    - glab -R $CI_PROJECT_PATH securefile download --all --output-dir=".secure-files/"
    - mkdir -p ~/.ssh && chmod 700 ~/.ssh
    - cp .secure-files/$SSH_KEY_NAME ~/.ssh/ && chmod 600 ~/.ssh/$SSH_KEY_NAME
    - eval "$(ssh-agent -s)"
    - ssh-add ~/.ssh/$SSH_KEY_NAME
    - ssh-keyscan -H "$DEPLOY_HOST" >> ~/.ssh/known_hosts  # Verhindert interaktive Host Key Abfrage
    - chmod 644 ~/.ssh/known_hosts
  script:
    - >
      ssh "$DEPLOY_USER@$DEPLOY_HOST"
      "printf '%s' '$CI_REGISTRY_PASSWORD' | docker login -u '$CI_REGISTRY_USER' --password-stdin '$REGISTRY_HOST:$REGISTRY_PORT' &&
       docker pull '$APP_IMAGE' &&
       docker rm -f coffee-haven 2>/dev/null || true &&
       docker run -td --rm --name coffee-haven -p 80:8080 $APP_IMAGE"
