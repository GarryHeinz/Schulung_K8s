stages:
  - lint
  - test
  - build
  - review
  - deploy

variables:  # Passe die globalen Variablen an dein Setup an
  REGISTRY_HOST: "gitlab-schulung.oci.ordix.de"
  REGISTRY_PORT: "5050"
  REGISTRY_IMAGE_PATH: "user1/mein_fork"
  APP_IMAGE: "$REGISTRY_HOST:$REGISTRY_PORT/$REGISTRY_IMAGE_PATH:latest"
  SSH_KEY_NAME: "CI-WorkShop.pem"
  DEPLOY_HOST: "127.0.0.1"
  DEPLOY_USER: "opc"

.setup-ssh-with-secure-files:
  image: alpine:latest
  before_script:
    - apk add --no-cache openssh-client glab

    # secure_files installieren
    - glab auth login --job-token $CI_JOB_TOKEN --hostname $CI_SERVER_FQDN --api-protocol $CI_SERVER_PROTOCOL
    - glab -R "$CI_PROJECT_PATH" securefile download --all --output-dir=".secure-files/"

    
    # SSH Konfiguration
    - mkdir -p ~/.ssh && chmod 700 ~/.ssh
    - cp .secure-files/$SSH_KEY_NAME ~/.ssh/$SSH_KEY_NAME && chmod 600 ~/.ssh/$SSH_KEY_NAME
    - eval "$(ssh-agent -s)"  # Start SSH Agent für Key Nutzung
    - ssh-add ~/.ssh/$SSH_KEY_NAME
    - ssh-keyscan -H "$DEPLOY_HOST" >> ~/.ssh/known_hosts  # Verhindert interaktive Host Key Abfrage
    - chmod 644 ~/.ssh/known_hosts

lint-test-job:
  image: ghcr.io/astral-sh/uv:0.9.24-python3.10-alpine
  stage: test
  script:
    - uv run ruff check

unit-test-job:
  image: ghcr.io/astral-sh/uv:0.9.24-python3.10-alpine
  stage: test
  before_script:
    - cd $CI_PROJECT_DIR
  script:
    - uv run pytest

build-job:
  stage: build
  image: quay.io/buildah/stable:latest
  before_script:
    - echo "$CI_REGISTRY_PASSWORD" | buildah login --username "$CI_REGISTRY_USER" --password-stdin "$REGISTRY_HOST:$REGISTRY_PORT"
    - export APP_IMAGE="$REGISTRY_HOST:$REGISTRY_PORT/$REGISTRY_IMAGE_PATH:$CI_COMMIT_SHORT_SHA"
    - export APP_IMAGE_LATEST="$REGISTRY_HOST:$REGISTRY_PORT/$REGISTRY_IMAGE_PATH:latest"
  script:
    - buildah bud --isolation=chroot -t "$APP_IMAGE" -t "$APP_IMAGE_LATEST" .
    - buildah push "$APP_IMAGE"
    - buildah push "$APP_IMAGE_LATEST"
  artifacts:
    reports:
      dotenv: build.env
  after_script:
    - echo "APP_IMAGE=$REGISTRY_HOST:$REGISTRY_PORT/$REGISTRY_IMAGE_PATH:$CI_COMMIT_SHORT_SHA" >> build.env

review-deploy:
  stage: review
  extends: .setup-ssh-with-secure-files
  needs: ["build-job"]
  variables:
    DEPLOY_PORT: "$REVIEW_PORT"
  script:
    - apk add --no-cache docker-cli
    - >
      ssh "$DEPLOY_USER@$DEPLOY_HOST"
      "printf '%s' '$CI_REGISTRY_PASSWORD' | docker login -u '$CI_REGISTRY_USER' --password-stdin '$REGISTRY_HOST:$REGISTRY_PORT' &&
       docker pull '$APP_IMAGE' &&
       docker rm -f coffee-haven-review 2>/dev/null || true &&
       docker run -d --name coffee-haven-review -p ${DEPLOY_PORT:-8080}:8080 $APP_IMAGE"
  environment:
    name: review/$CI_COMMIT_REF_SLUG
    url: http://$REVIEW_HOST:${DEPLOY_PORT:-8080}
    on_stop: stop_review
    auto_stop_in: 3 days
  rules:
    - if: '$CI_COMMIT_BRANCH && $CI_COMMIT_BRANCH != $CI_DEFAULT_BRANCH'

stop_review:
  stage: review
  extends: .setup-ssh-with-secure-files
  script:
    - ssh "$DEPLOY_USER@$DEPLOY_HOST" "docker rm -f coffee-haven-review || true"
  environment:
    name: review/$CI_COMMIT_REF_SLUG
    action: stop
  rules:
    - if: '$CI_COMMIT_BRANCH && $CI_COMMIT_BRANCH != $CI_DEFAULT_BRANCH'
      when: manual
      allow_failure: true

deploy-prod:
  stage: deploy
  extends: .setup-ssh-with-secure-files
  needs: ["build-job"]
  script:
    - apk add --no-cache docker-cli
    - >
      ssh "$DEPLOY_USER@$DEPLOY_HOST"
      "printf '%s' '$CI_REGISTRY_PASSWORD' | docker login -u '$CI_REGISTRY_USER' --password-stdin '$REGISTRY_HOST:$REGISTRY_PORT' &&
       docker pull '$APP_IMAGE' &&
       docker rm -f coffee-haven 2>/dev/null || true &&
       docker run -d --name coffee-haven -p 80:8080 $APP_IMAGE"
  environment:
    name: production
    url: http://$PROD_HOST
  rules:
    - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'
