stages:
  - test
  - build
  - deploy

variables:
  LOG_LEVEL: "DEBUG"

lint-test-job:
  image: ghcr.io/astral-sh/uv:0.9.24-python3.10-alpine
  stage: test
  script:
    - uv run ruff check

unit-test-job:
  image: ghcr.io/astral-sh/uv:0.9.24-python3.10-alpine
  stage: test
  script:
    - >-
      uv run pytest --cov
      --cov-report=xml:coverage.xml
      --junitxml=junit.xml
  coverage: '/TOTAL.*? (100(?:\.0+)?\%|[1-9]?\d(?:\.\d+)?\%)$/'
  artifacts:
    when: always
    reports:
      junit:
        - junit.xml
      coverage_report:
        coverage_format: cobertura
        path: coverage.xml

build-job:
  stage: build
  script:
    - echo "Compiling the code..."
    - echo "Compile complete."

deploy-job:
  stage: deploy
  environment: production
  script:
    - echo "Using log level $LOG_LEVEL"
    - echo "Deploying application..."
    - echo "Application successfully deployed."
