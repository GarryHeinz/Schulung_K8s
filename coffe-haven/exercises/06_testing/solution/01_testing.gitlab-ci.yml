stages:
  - test
  - build
  - deploy

variables:
  LOG_LEVEL: "DEBUG"

lint-test-job:
  image: ghcr.io/astral-sh/uv:0.9.24-python3.10-alpine
  stage: test
  script:
    - uv run ruff check

unit-test-job:
  image: ghcr.io/astral-sh/uv:0.9.24-python3.10-alpine
  stage: test
  script:
    - uv run pytest

build-job:
  stage: build
  script:
    - echo "Compiling the code..."
    - echo "Compile complete."

deploy-job:
  stage: deploy
  environment: production
  script:
    - echo "Using log level $LOG_LEVEL"
    - echo "Deploying application..."
    - echo "Application successfully deployed."
