[project]
name = "ecommerce-frontend"
version = "0.1.0"
description = "E-commerce frontend web application"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "flask>=3.1.2",
    "gunicorn>=21.2.0",
]

[dependency-groups]
dev = ["pyright>=1.1.405", "pytest>=8.4.2", "ruff>=0.13.0"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
addopts = "-v"


[tool.ruff]
line-length = 88
target-version = "py310"
extend-exclude = ["exercises/**"]

[tool.ruff.lint]
extend-select = ["ALL"]
ignore = ["E501", "S101", "ANN", "D", "ARG", "S", "COM812", "C901", "PLR"]

per-file-ignores = { "__init__.py" = ["F401"], "tests/**/*.py" = ["F821"] }

[tool.ruff.lint.isort]
known-first-party = ["app"]
section-order = [
    "future",
    "standard-library",
    "third-party",
    "first-party",
    "local-folder",
]

[tool.ruff.lint.mccabe]
max-complexity = 10

[tool.pyright]
include = ["app", "tests"]
exclude = ["**/__pycache__", "build", "dist"]
reportMissingImports = true
reportMissingTypeStubs = false
pythonVersion = "3.10"
typeCheckingMode = "basic"
