apiVersion: v1
kind: Pod
metadata:
  name: nginx-demo
spec:
  containers:
    - name: nginx
      image: nginx:latest
      ports:
        - containerPort: 80

      volumeMounts:
        - name: html-volume
          mountPath: /usr/share/nginx/html/index.html
          subPath: index.html

  volumes:
    - name: html-volume
      configMap:
        name: nginx-config
        items:
          - key: index.html
            path: index.html
  restartPolicy: Never
