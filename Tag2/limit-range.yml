apiVersion: v1
kind: LimitRange
metadata:
  name: limit-range
spec:
  limits:
  - type: Container
    default:
      # Limit
      cpu: 50m
      memory: 512Mi
    defaultRequest:
      # Request
      cpu: 50m
      memory: 256Mi
    max:
      cpu: 50m
      memory: 512Mi
    min:
      cpu: 50m
      memory: 256Mi

# https://kubernetes.io/docs/concepts/policy/limit-range/
#
#
